<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Pendientes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Paleta por defecto: MODO OSCURO */
        :root {
            --bg-color: #121212;       
            --card-bg: #1e1e1e;        
            --text-main: #e2e8f0;      
            --text-muted: #a0aec0;     
            --primary: #6366f1;        
            --success: #10b981;        
            --danger: #ef4444;         
            --border-color: #2d3748;   
            --input-placeholder: #718096;
            --filter-inactive-bg: #2d3748;
            --time-trigger-bg: #2d3748;
            --footer-bg: #1a1a1a;
            --empty-icon-color: #2d3748;
            --pulse-bg-start: #1e1e1e;
            --pulse-bg-mid: #3b1414;
            
            /* NUEVA ESCALA DE COLORES TEMPORALES (MODO OSCURO) */
            --color-today: #fbbf24;       /* Amarillo: Hoy */
            --color-tomorrow: #34d399;    /* Verde: Mañana */
            --color-overmorrow: #22d3ee;  /* Cian: Pasado mañana */
            --color-short-term: #3b82f6;  /* Azul: Corto plazo (4-7 días) */
            --color-long-term: #a855f7;   /* Morado: Mediano/Largo plazo (+7 días) */
            --edit-mode: #06b6d4;      
        }

        /* Variaciones para MODO CLARO */
        :root.light-theme {
            --bg-color: #f4f7f6;       
            --card-bg: #ffffff;        
            --text-main: #2d3748;      
            --text-muted: #718096;     
            --primary: #4f46e5;        
            --success: #10b981;        
            --danger: #ef4444;         
            --border-color: #e2e8f0;   
            --input-placeholder: #a0aec0;
            --filter-inactive-bg: #e2e8f0;
            --time-trigger-bg: #f1f5f9;
            --footer-bg: #ffffff;
            --empty-icon-color: #cbd5e1;
            --pulse-bg-start: #ffffff;
            --pulse-bg-mid: #fee2e2;
            
            /* COLORES TEMPORALES AJUSTADOS PARA MODO CLARO (MÁS CONTRASTE) */
            --color-today: #b45309;       
            --color-tomorrow: #059669;    
            --color-overmorrow: #0891b2;  
            --color-short-term: #1d4ed8;  
            --color-long-term: #7e22ce;   
            --edit-mode: #06b6d4;      
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 95px; 
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            margin-bottom: 15px;
            padding: 5px;
            position: relative;
        }

        header h1 { font-size: 1.4rem; font-weight: 700; }
        header p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }

        .theme-toggle-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--filter-inactive-bg);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s, color 0.3s;
        }

        .filter-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .filter-btn {
            flex: 1;
            background: var(--filter-inactive-bg);
            border: none;
            padding: 8px 5px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .filter-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .input-box {
            background: var(--card-bg);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            border: 2px solid transparent;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .input-box.editing-active {
            border-color: var(--edit-mode);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-row input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px;
            font-size: 1rem;
            background: transparent;
            color: var(--text-main);
        }

        .input-row input[type="text"]::placeholder {
            color: var(--input-placeholder);
        }

        .time-trigger {
            background: var(--time-trigger-bg);
            border: none;
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .time-trigger input[type="datetime-local"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .time-trigger.active {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .add-btn.edit-state {
            background: var(--edit-mode);
        }

        .task-list { display: flex; flex-direction: column; gap: 10px; }

        .task-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            touch-action: manipulation;
            gap: 8px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
            min-width: 0;
        }

        .check-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .task-card.completed .check-btn {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .task-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .task-text { font-size: 0.95rem; font-weight: 500; color: var(--text-main); word-break: break-word; }
        .task-card.completed .task-text { text-decoration: line-through; color: var(--text-muted); }
        
        .task-time {
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        /* Clases CSS mapeadas a las nuevas variables de color */
        .task-time.t-today { color: var(--color-today); }
        .task-time.t-tomorrow { color: var(--color-tomorrow); }
        .task-time.t-overmorrow { color: var(--color-overmorrow); }
        .task-time.t-short-term { color: var(--color-short-term); }
        .task-time.t-long-term { color: var(--color-long-term); }

        .actions-right {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px;
            font-size: 1rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        .action-btn.edit:active { color: var(--edit-mode); }
        .action-btn.delete:active { color: var(--danger); }

        .task-card.alarm-active {
            border: 2px solid var(--danger);
            animation: pulse-border 1.2s infinite;
        }

        .task-card.alarm-active .task-time { color: var(--danger) !important; }

        @keyframes pulse-border {
            0% { background-color: var(--pulse-bg-start); }
            50% { background-color: var(--pulse-bg-mid); }
            100% { background-color: var(--pulse-bg-start); }
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 0.9rem;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--footer-bg);
            padding: 12px 6px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            z-index: 200;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .backup-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            touch-action: manipulation;
            flex: 1;
        }

        .backup-btn i { font-size: 1.1rem; color: var(--text-main); }
        .backup-btn.purge-highlight i { color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>Mis Pendientes</h1>
        <p id="task-counter">0 tareas en la lista</p>
        
        <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
            <i class="fa-solid fa-sun" id="theme-icon"></i>
        </button>

        <div class="filter-container">
            <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">Todos</button>
            <button class="filter-btn" id="filter-today" onclick="setFilter('today')">Hoy</button>
            <button class="filter-btn" id="filter-done" onclick="setFilter('done')">Realizados</button>
        </div>
    </header>

    <div class="input-box" id="input-box">
        <div class="input-row">
            <input type="text" id="task-input" placeholder="Nuevo pendiente..." autocomplete="off">
            <div class="time-trigger" id="time-icon">
                <i class="fa-regular fa-clock"></i>
                <input type="datetime-local" id="task-datetime" onchange="updateTimeIcon()">
            </div>
            <button class="add-btn" id="add-btn"><i class="fa-solid fa-plus" id="add-icon"></i></button>
        </div>
    </div>

    <div class="task-list" id="task-list"></div>

    <div id="empty-msg" class="empty-state">
        <i class="fa-solid fa-circle-check" id="empty-icon" style="font-size: 1.8rem; margin-bottom: 8px; color: var(--empty-icon-color);"></i>
        <p>No hay tareas para mostrar.</p>
    </div>

    <footer>
        <button class="backup-btn" onclick="exportBackup()">
            <i class="fa-solid fa-cloud-arrow-down"></i> Respaldar Todo
        </button>
        <button class="backup-btn purge-highlight" onclick="backupAndPurgeDone()">
            <i class="fa-solid fa-broom"></i> Respaldar y Limpiar
        </button>
        <button class="backup-btn" onclick="importBackup()">
            <i class="fa-solid fa-cloud-arrow-up"></i> Restaurar Lista
        </button>
    </footer>

    <script>
        const taskInput = document.getElementById('task-input');
        const taskDatetime = document.getElementById('task-datetime');
        const timeIcon = document.getElementById('time-icon');
        const addBtn = document.getElementById('add-btn');
        const addIcon = document.getElementById('add-icon');
        const inputBox = document.getElementById('input-box');
        const taskList = document.getElementById('task-list');
        const emptyMsg = document.getElementById('empty-msg');
        const taskCounter = document.getElementById('task-counter');
        const themeIcon = document.getElementById('theme-icon');

        let audioCtx = null;
        let currentFilter = 'all'; 
        let tasks = JSON.parse(localStorage.getItem('my_tasks_v2')) || [];
        let editIndex = null;

        let currentTheme = localStorage.getItem('app_theme') || 'dark';
        
        function applyTheme() {
            if (currentTheme === 'light') {
                document.documentElement.classList.add('light-theme');
                themeIcon.className = "fa-solid fa-moon";
            } else {
                document.documentElement.classList.remove('light-theme');
                themeIcon.className = "fa-solid fa-sun";
            }
        }
        
        function toggleTheme() {
            currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            localStorage.setItem('app_theme', currentTheme);
            applyTheme();
        }
        
        applyTheme();

        function updateTimeIcon() {
            if (taskDatetime.value) { timeIcon.classList.add('active'); } 
            else { timeIcon.classList.remove('active'); }
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filterType}`).classList.add('active');
            renderTasks();
        }

        function saveAndRender() {
            if (editIndex === null) {
                tasks.sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed - b.completed; 
                    if (!a.datetime) return 1; 
                    if (!b.datetime) return -1;
                    return new Date(a.datetime) - new Date(b.datetime); 
                });
            }
            localStorage.setItem('my_tasks_v2', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            taskList.innerHTML = '';
            const ahora = new Date();
            
            const offset = ahora.getTimezoneOffset() * 60000;
            
            // Creamos las fechas base limpias (en la zona horaria local) para la comparación
            const baseDate = new Date(ahora.getTime() - offset);
            
            const hoyStr = baseDate.toISOString().split('T')[0];
            
            baseDate.setDate(baseDate.getDate() + 1);
            const mañanaStr = baseDate.toISOString().split('T')[0];
            
            baseDate.setDate(baseDate.getDate() + 1);
            const pasadoMañanaStr = baseDate.toISOString().split('T')[0];

            let filteredTasks = tasks.filter(task => {
                if (currentFilter === 'done') return task.completed;
                if (currentFilter === 'all') return !task.completed;
                if (currentFilter === 'today') {
                    if (task.completed || !task.datetime) return false;
                    return task.datetime.startsWith(hoyStr);
                }
                return true; 
            });

            const pendingTotal = tasks.filter(t => !t.completed).length;
            taskCounter.innerText = `${pendingTotal} pendiente${pendingTotal !== 1 ? 's' : ''} en total`;

            if (filteredTasks.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }
            emptyMsg.style.display = 'none';

            filteredTasks.forEach((task) => {
                const originalIndex = tasks.indexOf(task);
                const card = document.createElement('div');
                
                let isAlarmed = false;
                let timeLabel = '';
                
                if (task.datetime) {
                    const tTime = new Date(task.datetime).getTime();
                    const fechaFormat = new Date(task.datetime).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                    
                    // LÓGICA DE CLASIFICACIÓN AVANZADA
                    let colorClass = '';
                    
                    if (task.datetime.startsWith(hoyStr)) {
                        colorClass = 't-today';        // Amarillo (Hoy)
                    } else if (task.datetime.startsWith(mañanaStr)) {
                        colorClass = 't-tomorrow';     // Verde (Mañana)
                    } else if (task.datetime.startsWith(pasadoMañanaStr)) {
                        colorClass = 't-overmorrow';   // Cian (Pasado Mañana)
                    } else {
                        // Cálculo exacto de la diferencia en días para corto y largo plazo
                        const fechaTarea = new Date(task.datetime.split('T')[0] + 'T00:00:00');
                        const fechaHoy = new Date(hoyStr + 'T00:00:00');
                        const diffTiempo = fechaTarea - fechaHoy;
                        const diffDias = Math.ceil(diffTiempo / (1000 * 60 * 60 * 24));
                        
                        if (diffDias > 2 && diffDias <= 7) {
                            colorClass = 't-short-term'; // Azul (Corto plazo: días 4 a 7)
                        } else if (diffDias > 7) {
                            colorClass = 't-long-term';  // Morado (Mediano/Largo plazo: +7 días)
                        } else {
                            colorClass = 't-today';      // Respaldo para tareas atrasadas de días anteriores
                        }
                    }

                    timeLabel = `<span class="task-time ${colorClass}"><i class="fa-solid fa-bell"></i> ${fechaFormat}</span>`;
                    
                    if (!task.completed && ahora.getTime() >= tTime) { isAlarmed = true; }
                }

                card.className = `task-card ${task.completed ? 'completed' : ''} ${isAlarmed ? 'alarm-active' : ''}`;
                
                card.innerHTML = `
                    <div class="task-left" onclick="toggleTask(${originalIndex})">
                        <button class="check-btn"><i class="fa-solid fa-check"></i></button>
                        <div class="task-info">
                            <span class="task-text">${task.text}</span>
                            ${timeLabel}
                        </div>
                    </div>
                    <div class="actions-right">
                        <button class="action-btn edit" onclick="startEdit(event, ${originalIndex})">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="action-btn delete" onclick="deleteTask(event, ${originalIndex})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                taskList.appendChild(card);
            });
        }

        function startEdit(event, index) {
            event.stopPropagation();
            editIndex = index;
            taskInput.value = tasks[index].text;
            taskDatetime.value = tasks[index].datetime || '';
            updateTimeIcon();
            inputBox.classList.add('editing-active');
            addBtn.classList.add('edit-state');
            addIcon.className = "fa-solid fa-floppy-disk";
            taskInput.focus();
        }

        function handleSubmit() {
            const text = taskInput.value.trim();
            if (text === '') return;

            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

            if (editIndex !== null) {
                tasks[editIndex].text = text;
                tasks[editIndex].datetime = taskDatetime.value || null;
                editIndex = null;
                inputBox.classList.remove('editing-active');
                addBtn.classList.remove('edit-state');
                addIcon.className = "fa-solid fa-plus";
            } else {
                tasks.push({
                    text: text,
                    datetime: taskDatetime.value || null,
                    completed: false
                });
            }

            taskInput.value = '';
            taskDatetime.value = '';
            timeIcon.classList.remove('active');
            saveAndRender();
        }

        function toggleTask(index) {
            if (editIndex === index) cancelEdit();
            tasks[index].completed = !tasks[index].completed;
            saveAndRender();
        }

        function deleteTask(event, index) {
            event.stopPropagation();
            if (editIndex === index) cancelEdit();
            if(confirm("¿Eliminar este pendiente?")) {
                tasks.splice(index, 1);
                saveAndRender();
            }
        }

        function cancelEdit() {
            editIndex = null;
            taskInput.value = '';
            taskDatetime.value = '';
            timeIcon.classList.remove('active');
            inputBox.classList.remove('editing-active');
            addBtn.classList.remove('edit-state');
            addIcon.className = "fa-solid fa-plus";
        }

        function getBackupString() {
            return btoa(unescape(encodeURIComponent(JSON.stringify(tasks))));
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement("input");
            document.body.appendChild(tempInput);
            tempInput.value = text;
            tempInput.select();
            tempInput.setSelectionRange(0, 99999); 
            document.execCommand("copy");
            document.body.removeChild(tempInput);
        }

        function exportBackup() {
            if (tasks.length === 0) { alert("No hay tareas para respaldar."); return; }
            const dataStr = getBackupString();
            copyToClipboard(dataStr);
            alert("¡Copia de seguridad completa copiada!\nPégala en tus notas de WhatsApp.");
        }

        function backupAndPurgeDone() {
            const completedTasksCount = tasks.filter(t => t.completed).length;
            if (completedTasksCount === 0) {
                alert("No hay tareas realizadas para limpiar.");
                return;
            }
            if (confirm(`Se va a generar una copia de seguridad y luego se eliminarán las ${completedTasksCount} tareas realizadas. ¿Deseas continuar?`)) {
                const fullBackupCode = getBackupString();
                copyToClipboard(fullBackupCode);
                tasks = tasks.filter(t => !t.completed);
                cancelEdit();
                saveAndRender();
                alert(`¡Operación Exitosa!\n1. Se copió el respaldo completo al portapapeles.\n2. Se eliminaron las ${completedTasksCount} tareas realizadas.`);
            }
        }

        function importBackup() {
            const code = prompt("Pega aquí el código de tu copia de seguridad:");
            if (!code) return;
            try {
                const decodedData = JSON.parse(decodeURIComponent(escape(atob(code))));
                if (Array.isArray(decodedData)) {
                    if (confirm(`Se cargarán ${decodedData.length} tareas. Reemplazará la lista actual. ¿Continuar?`)) {
                        tasks = decodedData;
                        cancelEdit();
                        saveAndRender();
                        alert("¡Lista restaurada!");
                    }
                } else { alert("Código no válido."); }
            } catch (e) { alert("Error al procesar el código."); }
        }

        function playBeep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        setInterval(() => {
            if (tasks.length === 0) return;
            const ahora = new Date().getTime();
            let sonar = false;

            tasks.forEach(t => {
                if (t.datetime && !t.completed) {
                    if (ahora >= new Date(t.datetime).getTime()) { sonar = true; }
                }
            });

            if (sonar) { playBeep(); renderTasks(); }
        }, 2000);

        addBtn.addEventListener('click', handleSubmit);
        taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSubmit(); });

        renderTasks();
    </script>
</body>
</html>
